# Plugin record layout (from "bmd:"): 256-byte NUL-padded name "bmd:<Name>:<ID>", 4 x int32 editor window
# rect (-1 = never opened), u32 state flags. Track built-in FX (slot >= 6): bit 0x10 set = effect disabled.
# Verified for Voice Isolation only (UI on/off toggles on two tracks, amount unchanged; API on/off).
# The meaning of the flags for insert plugins and other built-in FX is not decoded (shown raw with --all).
plugin_state:
  disabled_bit: 0x10
  enabled_for_builtin: [Voice Isolation]
plugins:
  Voice Isolation:
    "BMDVoiceIsolationControl::DRY_MIX": {label: amount, kind: linear, min: 0, max: 100, unit: "", conf: two_point}
  Dialogue Leveler:
    "UI_BAS_PRESET": {label: mode, kind: enum, map: {0.0: "0 ALLOW_WIDER_DYNAMICS", 0.3333333432674408: "1 OPTIMIZE_MODERATE_LEVELS", 0.6666666865348816: "2 MORE_LIFT_FOR_LOW_LEVELS", 1.0: "3 LIFT_SOFT_WHISPERY_SOURCES"}, conf: direct}
    "UI_ADV_RIDER_ON": {label: reduce_loud, kind: flag, conf: direct}
    "UI_BAS_LIFTER_ON": {label: lift_soft, kind: flag, conf: direct}
    "UI_BAS_CLEANER_ON": {label: background_reduction, kind: flag, conf: direct}
    "UI_BAS_OUTPUT_GAIN": {label: output_gain, kind: linear, min: 0, max: 6, unit: dB, conf: two_point}
  De-Esser:
    BMDDeesser::RANGE: {label: freq, kind: log, min: 700, max: 9000, unit: Hz, conf: two_point}
    BMDDeesser::MODE:
      label: mode
      kind: enum
      map: {0.0: narrow band, 0.5: centered bell}
      conf: calib
    BMDDeesser::AMOUNT: {label: amount, kind: linear, min: 0, max: 100, unit: '%', conf: two_point}
    Deesser::REACTION:
      label: reaction
      kind: enum
      map: {0.5: medium}
      conf: calib
    BMDDeesser::ESS_ONLY: {label: s_only, kind: flag, conf: direct}
  Vocal Channel:
    BMDVocalChannel::HPF_IN: {label: hp_on, kind: flag, conf: direct}
    BMDVocalChannel::EQ_IN: {label: eq_on, kind: flag, conf: direct}
    BMDVocalChannel::COMP_IN: {label: comp_on, kind: flag, conf: direct}
    BMDVocalChannel::COMP_THRES: {label: threshold, kind: linear, min: -40, max: 0, unit: dB, conf: two_point}
    BMDVocalChannel::COMP_RATIO: {label: ratio, kind: linear, min: 1.1, max: 7.0, unit: ':1', conf: two_point}
    BMDVocalChannel::COMP_REACTION: {label: response, kind: linear, min: 0, max: 1, unit: '', conf: direct}
    BMDVocalChannel::COMP_GAIN: {label: gain, kind: linear, min: 0, max: 20, unit: dB, conf: two_point}
  Limiter:
    BMDLimiter::INPUT_GAIN: {label: input, kind: linear, min: -18, max: 18, unit: dB, conf: two_point}
    BMDLimiter::THRESHOLD: {label: ceiling, kind: linear, min: -24, max: 0, unit: dBTP, conf: two_point}
    BMDLimiter::RELEASE:
      label: release
      kind: enum
      map: {0.8829268217086792: 190.55 ms}
      conf: calib
    BMDLimiter::SOFT: {label: soft, kind: flag, conf: direct}
clip_colors: {2: Green, 4: Teal, 6: Blue, 8: Purple, 10: Pink, 12: Tan, 14: Brown, 16: Apricot, 18: Beige, 20: Chocolate, 22: Lime, 24: Navy, 26: Olive, 28: Orange, 30: Violet, 32: Yellow}
transition_alignment: {1: starts at edit point (right), 2: centered on edit point, 3: ends at edit point (left)}
# clip_effects: per-clip <EffectFiltersBA> (drp SeqContainer) / Sm2TiItem.EffectFiltersBA (Project.db), used by --edits.
#   effect type 124 = "Fairlight Clip Volume and Fades"; params: 95 clip volume (dB), 97 fade in, 98 fade out (frames)
clip_effects:
  124: {name: Fairlight Clip Volume and Fades, params: {95: volume_db, 97: fade_in, 98: fade_out, 99: fade_in_curve, 100: fade_out_curve}}
