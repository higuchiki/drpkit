# Fairlight (DaVinci Resolve 21.1.1) FLStudioModelBA item map -- single source of truth.
# See FORMAT.md for the binary layout and how each entry was derived.
#
# conf (confidence) values:
#   direct    = stored value read as-is or times a constant; cross-checked against known UI values
#   two_point = linear/log formula fixed by two or more known points
#   calib     = lookup table of UI value vs stored value (unknown stored values print "未較正(raw=...)")
#   assumed   = single point, range assumed (reference only)
#   raw       = meaning unknown; raw value only
#   law       = (implicit for kind: law) built-in Dynamics conversion table, see dyn_laws
#
# channel_items: per-channel int32 records in the channel settings tables (track table and bus table share ids).
# dyn_laws: stored value r -> UI value for built-in Dynamics time/ratio knobs.
#   r <= 100      legacy encoding (knob position %), log-interpolated in `legacy`
#   r >= 5000     M = (r+5)//100 (0..1000), d = r - 100*M (-5..94); UI = law[M] + d*fine
#   101..4999     UI field shows blank
# plugins: EffectPresets "64-byte name + float32 normalized value" entries.
# clip_colors / # timeline marker colors (bit value stored in the marker record; 256 is unused). Verified with all 16 API colors.
marker_colors: {2: Blue, 4: Cyan, 8: Green, 16: Yellow, 32: Red, 64: Pink, 128: Purple, 512: Fuchsia, 1024: Rose, 2048: Lavender,
  4096: Sky, 8192: Mint, 16384: Lemon, 32768: Sand, 65536: Cocoa, 131072: Cream}
transition_alignment: used by --edits.

